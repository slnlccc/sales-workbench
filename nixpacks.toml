[phases.setup]
nixPkgs = ["nodejs_20"]

[phases.install]
cmds = [
  "echo '[Install 1/2] server ...' && cd server && npm install --no-audit --no-fund --production=false",
  "echo '[Install 2/2] lite   ...' && cd lite   && npm install --no-audit --no-fund --production=false"
]

[phases.build]
cmds = [
  "echo '[Build 1/1] vite ...' && cd lite && npm run build && mkdir -p ../server/dist && cp -r dist/* ../server/dist/ && echo 'Copy OK, index size:' && ls -la ../server/dist/index.html"
]

[start]
cmd = "cd server && node src/server.js"
