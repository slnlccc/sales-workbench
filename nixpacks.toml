# Railway 构建配置 - 销售工作台
[phases.install]
cmds = [
  "npm install --include=dev",
  "cd server && MONGOMS_DISABLE_POSTINSTALL=1 npm install"
]

[phases.build]
cmds = [
  "npm run build",
  "mkdir -p server/dist",
  "cp -r dist/* server/dist/"
]

# 启动阶段：确保dist可用后启动后端
[start]
cmd = "cd server && if [ ! -d dist ] || [ ! -f dist/index.html ]; then cd .. && npm run build && cp -r dist server/dist/ && cd server; fi && npm start"
