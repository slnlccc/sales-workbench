# Railway 构建配置 - 销售工作台
# 构建阶段：安装根目录前端依赖（含dev） + server目录后端依赖 + 构建前端
[phases.install]
cmds = [
  "npm install --include=dev",
  "cd server && MONGOMS_DISABLE_POSTINSTALL=1 npm install"
]

[phases.build]
cmds = [
  "npm run build",
  "cp -r dist server/dist"
]

# 启动阶段：从 server 目录启动后端，后端 serve dist 静态文件
[start]
cmd = "cd server && npm start"
